---
layout: default
---
<div class="container" style="margin-top: 60px;">
  <article>
    <h1 style="font-size: 32px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; line-height: 1.4;">{{ page.title }}</h1>
    <div class="post-meta" style="margin-bottom: 40px;">发布于 {{ page.date | date: "%Y年%m月%d日" }}</div>
    
    <div style="font-size: 17px; line-height: 1.9; color: #333;">
      {{ content }}
    </div>
  </article>
</div>
