---
layout: default
---
<div class="container" style="margin-top: 40px;">
  <article>
    <h1 style="font-size: 28px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; line-height: 1.4;">{{ page.title }}</h1>
    
    <!-- 日期与标签区域 -->
    <div class="post-meta" style="margin-bottom: 40px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
      <span>发布于 {{ page.date | date: "%Y年%m月%d日" }}</span>
      {% if page.tags.size > 0 %}
        <span style="opacity: 0.5;">|</span>
        {% for tag in page.tags %}
          <a href="/tags/#{{ tag }}" class="post-tag">{{ tag }}</a>
        {% endfor %}
      {% endif %}
    </div>

    <div style="font-size: 16px; line-height: 1.8; color: var(--text-main); opacity: 0.9;">
      {{ content }}
    </div>
  </article>

  <div class="giscus-container" style="margin-top: 60px; padding-top: 30px; border-top: 1px solid var(--border-color);">
    <script src="https://giscus.app/client.js"
            data-repo="liyuwriter/liyuwriter.github.io"
            data-repo-id="R_kgDOVbj_NQ"
            data-category="Announcements"
            data-category-id="DIC_kwDOVbj_Nc4DJ9sd"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="css/giscus-light.css"
            data-lang="zh-CN"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</div>
