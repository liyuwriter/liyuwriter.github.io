---
layout: default
---
<div class="container post-container">
  <article>
    <h1 class="post-title">{{ page.title }}</h1>

    <div class="post-header-meta">
      <span>发布于 {{ page.date | date: "%Y年%m月%d日" }}</span>
      {% if page.tags.size > 0 %}
        <span class="meta-separator">·</span>
        {% for tag in page.tags %}
          <a href="/tags/#{{ tag }}" class="text-tag">#{{ tag }}</a>
        {% endfor %}
      {% endif %}
      <span class="view-count">
        阅读量 <span id="page-view-count">-</span> 次
      </span>
    </div>

    <div class="post-body">
      {{ content }}
    </div>
  </article>

  <div class="giscus-container">
    <script>
      (function() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var themeUrl = isDark
          ? 'https://liyuwriter.github.io/css/giscus-dark.css'
          : 'https://liyuwriter.github.io/css/giscus-light.css';

        var script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.setAttribute('data-repo', 'liyuwriter/liyuwriter.github.io');
        script.setAttribute('data-repo-id', 'R_kgDOVbj_NQ');
        script.setAttribute('data-category', 'Announcements');
        script.setAttribute('data-category-id', 'DIC_kwDOVbj_Nc4DJ9sd');
        script.setAttribute('data-mapping', 'pathname');
        script.setAttribute('data-theme', themeUrl);
        script.setAttribute('data-lang', 'zh-CN');
        script.setAttribute('crossorigin', 'anonymous');
        script.async = true;

        document.querySelector('.giscus-container').appendChild(script);
      })();
    </script>
  </div>
</div>

{% if site.data.counter.token %}
<script>window.GITHUB_COUNTER_TOKEN="{{ site.data.counter.token }}";</script>
{% endif %}
<script src="/assets/js/counter.js" defer></script>
