<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="/css/index.css">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="/" class="navbar-logo">{{ site.title }}</a>
      <span class="navbar-motto">I think, therefore I am.</span>
    </div>
    <div class="navbar-links">
      <a href="/">文章</a>
      <a href="/tags/">标签</a>
      <a href="/about/">关于</a>
      <a href="/feed.xml" target="_blank" title="RSS 订阅">RSS</a>
      <a href="https://github.com/liyuwriter" target="_blank">GitHub</a>
      <button id="theme-toggle" aria-label="切换深色/浅色模式">🌙</button>
    </div>
  </nav>
  
  {{ content }}
  
  <footer class="footer">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }}. Powered by Jekyll.
  </footer>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    
    function updateIcon() {
      if (htmlElement.getAttribute('data-theme') === 'dark') {
        toggleBtn.textContent = '☀️';
      } else {
        toggleBtn.textContent = '🌙';
      }
    }
    updateIcon();

    // 同步 Giscus 评论区主题
    function syncGiscusTheme(theme) {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (iframe) {
        // 指向我们自定义的 CSS URL
        const cssUrl = theme === 'dark' 
          ? 'https://liyuwriter.github.io/css/giscus-dark.css' 
          : 'https://liyuwriter.github.io/css/giscus-light.css';
          
        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: cssUrl } } },
          'https://giscus.app'
        );
      }
    }

    toggleBtn.addEventListener('click', function() {
      let newTheme;
      if (htmlElement.getAttribute('data-theme') === 'dark') {
        htmlElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        newTheme = 'light';
      } else {
        htmlElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        newTheme = 'dark';
      }
      updateIcon();
      syncGiscusTheme(newTheme);
    });
  </script>
</body>
</html>
