<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="/css/index.css">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hit-kounter@0.1.0/dist/hit-kounter.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="/" class="navbar-logo">{{ site.title }}</a>
      <span class="navbar-motto">I think, therefore I am.</span>
    </div>
    <div class="navbar-links">
      <a href="/">文章</a>
      <a href="/tags/">标签</a>
      <a href="/about/">关于</a>
      <a href="/feed.xml" target="_blank" title="RSS 订阅">RSS</a>
      <a href="https://github.com/liyuwriter" target="_blank">GitHub</a>
      <button id="theme-toggle" aria-label="切换深色/浅色模式">🌙</button>
    </div>
  </nav>
  
  {{ content }}
  
  <footer class="footer">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }}. Powered by Jekyll.
  </footer>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    // 绝对路径
    const cssLight = 'https://liyuwriter.github.io/css/giscus-light.css';
    const cssDark = 'https://liyuwriter.github.io/css/giscus-dark.css';

    function updateIcon() {
      toggleBtn.textContent = htmlElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }
    updateIcon();

    function syncGiscusTheme(theme) {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (iframe) {
        const cssUrl = theme === 'dark' ? cssDark : cssLight;
        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: cssUrl } } },
          'https://giscus.app'
        );
      }
    }

    // 极其暴力的轮询机制：因为 iframe 加载有延迟，我们每秒确认一次，直到同步成功
    function forceSync() {
      let attempts = 0;
      const interval = setInterval(() => {
        syncGiscusTheme(htmlElement.getAttribute('data-theme') || 'light');
        attempts++;
        if (attempts > 10) clearInterval(interval); // 最多试 10 次（10秒）
      }, 1000);
    }

    window.addEventListener('load', forceSync);

    toggleBtn.addEventListener('click', function() {
      let newTheme;
      if (htmlElement.getAttribute('data-theme') === 'dark') {
        htmlElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        newTheme = 'light';
      } else {
        htmlElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        newTheme = 'dark';
      }
      updateIcon();
      // 切换时立即发送一次，并在随后的几秒内持续发送确保覆盖
      syncGiscusTheme(newTheme);
      let count = 0;
      const reSync = setInterval(() => {
        syncGiscusTheme(newTheme);
        count++;
        if (count > 5) clearInterval(reSync);
      }, 500);
    });
  </script>
</body>
</html>
