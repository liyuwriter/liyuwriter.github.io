<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/feed.xml">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://giscus.app">
  {% seo %}
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到正文</a>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="/" class="navbar-logo">{{ site.title }}</a>
      <span class="navbar-motto">I think, therefore I am.</span>
    </div>
    <div class="navbar-links">
      <a href="/">文章</a>
      <a href="/tags/">标签</a>
      <a href="/about/">关于</a>
      <a href="/feed.xml" target="_blank" rel="noopener noreferrer" title="RSS 订阅">RSS</a>
      <a href="https://github.com/liyuwriter" target="_blank" rel="noopener noreferrer">GitHub</a>
      <button id="theme-toggle" aria-label="切换深色/浅色模式">🌙</button>
    </div>
  </nav>

  <main id="main-content">
  {{ content }}
  </main>

  <footer class="footer">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }}. Powered by Jekyll.
  </footer>

  <script>
    var toggleBtn = document.getElementById('theme-toggle');
    var htmlEl = document.documentElement;
    var cssLight = '{{ site.giscus_css_light }}';
    var cssDark = '{{ site.giscus_css_dark }}';

    function updateIcon() {
      toggleBtn.textContent = htmlEl.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }
    updateIcon();

    function syncGiscusTheme(theme) {
      var iframe = document.querySelector('iframe.giscus-frame');
      if (!iframe) return;
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme === 'dark' ? cssDark : cssLight } } },
        'https://giscus.app'
      );
    }

    function onGiscusMessage(e) {
      if (e.origin !== 'https://giscus.app') return;
      if (!(typeof e.data === 'object' && e.data.giscus)) return;
      if (e.data.giscus.keepAlive) return;
      var currentTheme = htmlEl.getAttribute('data-theme') || 'light';
      syncGiscusTheme(currentTheme);
      window.removeEventListener('message', onGiscusMessage);
    }
    window.addEventListener('message', onGiscusMessage);

    toggleBtn.addEventListener('click', function() {
      var isDark = htmlEl.getAttribute('data-theme') === 'dark';
      var newTheme = isDark ? 'light' : 'dark';
      if (isDark) {
        htmlEl.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      updateIcon();
      syncGiscusTheme(newTheme);
    });
  </script>
</body>
</html>
