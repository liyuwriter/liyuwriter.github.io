<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="/css/index.css">
  <script>
    // 防止页面闪烁：在渲染前检查本地存储或系统偏好
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="/" class="navbar-logo">{{ site.title }}</a>
      <span class="navbar-motto">I think, therefore I am.</span>
    </div>
    <div class="navbar-links">
      <a href="/">文章</a>
      <a href="/about/">关于</a>
      <a href="https://github.com/liyuwriter" target="_blank">GitHub</a>
      <button id="theme-toggle" aria-label="切换深色/浅色模式">🌙</button>
    </div>
  </nav>
  
  {{ content }}
  
  <footer class="footer">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }}. Powered by Jekyll.
  </footer>

  <script>
    // 切换主题逻辑
    const toggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    
    // 更新按钮图标的函数
    function updateIcon(theme) {
      toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    // 初始化图标
    updateIcon(htmlElement.getAttribute('data-theme'));

    // 监听点击事件
    toggleBtn.addEventListener('click', () => {
      if (htmlElement.getAttribute('data-theme') === 'dark') {
        htmlElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        updateIcon('light');
      } else {
        htmlElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        updateIcon('dark');
      }
    });
  </script>
</body>
</html>
