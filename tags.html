---
layout: page
title: 标签
permalink: /tags/
---

<div class="tag-cloud">
  {% for tag in site.tags %}
    <a href="#{{ tag[0] }}" class="tag-link">{{ tag[0] }} ({{ tag[1].size }})</a>
  {% endfor %}
</div>

{% for tag in site.tags %}
  <div class="tag-section">
    <h2 id="{{ tag[0] }}">{{ tag[0] }}</h2>
    <ul>
      {% for post in tag[1] %}
        <li>
          <span class="tag-date">{{ post.date | date: "%Y-%m-%d" }}</span>
          <a href="{{ post.url }}" class="tag-post-link">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endfor %}
